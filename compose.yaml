# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  nats:
    image: nats:2
    command:
      - "-js"
      - "-sd"
      - "/data"
    volumes:
      - type: bind
        source: "${NATS_DATA_DIR:?NATS_DATA_DIR must point to the mounted EBS data directory}"
        target: /data
        bind:
          create_host_path: false
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped
  broker:
    build:
      context: .
      args:
        APP_NAME: broker
      target: final
    env_file:
      - .env
    environment:
      NATS_MAX_AGE_HOURS: "${NATS_MAX_AGE_HOURS:-72}"
      NATS_TELEMATICS_MAX_BYTES: "${NATS_TELEMATICS_MAX_BYTES:?NATS_TELEMATICS_MAX_BYTES must be set}"
      NATS_COMMANDS_MAX_BYTES: "${NATS_COMMANDS_MAX_BYTES:?NATS_COMMANDS_MAX_BYTES must be set}"
    ports:
      - 4001:4001
    depends_on:
      - nats
    restart: unless-stopped

