[package]
name = "broker"
version = "0.18.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-nats = "0.46.0"
bytes = "1.11.1"
deadpool-postgres = "0.14.1"
dotenvy = "0.15.7"
futures-util = "=0.3.31"
hex = "0.4.3"
openssl = "0.10.75"
postgres-openssl = "0.5.2"
serde_json = "1.0.149"
tokio-postgres = "0.7.16"
tracing = "0.1"

[dependencies.sentry]
version = "0.46.2"
features = [ "tracing" ]

[dependencies.serde]
version = "1.0.228"
features = [ "derive" ]

[dependencies.tokio]
version = "1.48.0"
features = [ "full" ]

[dependencies.redis]
version = "1.0.4"
features = [ "tokio-comp" ]

[dependencies.socket2]
version = "0.6"
features = [ "all" ]

[dependencies.moka]
version = "0.12"
features = [ "future" ]

[dependencies.tracing-subscriber]
version = "0.3"
features = [ "env-filter" ]
