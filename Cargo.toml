[package]
name = "broker"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel-async = { version = "0.7.4", features = [
  "postgres",
  "pool",
  "deadpool",
] }
chrono = "0.4.43"
diesel = { version = "2.3.6", features = ["postgres"] }
dotenvy = "0.15.7"
hex = "0.4.3"
sentry = "0.46.2"
tokio = { version = "1.48.0", features = ["full"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
rustls-native-certs = "0.8"
