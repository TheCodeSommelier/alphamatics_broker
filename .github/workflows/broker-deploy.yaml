name: Release and deploy broker

# A main push creates one ARM64 release image, deploys it to staging, and then
# waits for GitHub production approval when production promotion is enabled.
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: broker-release-main
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.shipit.outputs.branch }}
      sha: ${{ steps.shipit.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cut release
        id: shipit
        run: |
          set -euo pipefail
          npx --yes --package @sladg/release-utils@3.0.0 utils shipit --changelog \
            --gitUser "github-actions[bot]" \
            --gitEmail "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          [[ "$branch" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, release]
    runs-on: ubuntu-24.04-arm
    environment: Staging
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Name release image
        id: name
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          RELEASE_BRANCH: ${{ needs.release.outputs.branch }}
        run: |
          set -euo pipefail
          version="${RELEASE_BRANCH#release/}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "tag=$REGISTRY/$REPOSITORY:$version-$short_sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 broker image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.tag }}
          cache-from: type=gha,scope=broker-arm64
          cache-to: type=gha,mode=max,scope=broker-arm64

      - name: Verify immutable digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_BRANCH: ${{ needs.release.outputs.branch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "Broker $RELEASE_BRANCH: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy_staging:
    name: Staging ${{ needs.release.outputs.branch }}
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: Staging
    concurrency:
      group: deploy-broker-staging
      queue: max
      cancel-in-progress: false
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy broker to staging ASG
        env:
          DEPLOY_STAGE: staging
          ASG_NAME: ${{ vars.EC2_ASG_NAME || 'alphamatics-stage-broker-asg' }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ID: ${{ vars.AWS_SECRET_ID }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          NATS_MAX_AGE_HOURS: ${{ vars.NATS_MAX_AGE_HOURS || '72' }}
          NATS_TELEMATICS_MAX_BYTES: ${{ vars.NATS_TELEMATICS_MAX_BYTES }}
          NATS_COMMANDS_MAX_BYTES: ${{ vars.NATS_COMMANDS_MAX_BYTES }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          export BROKER_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST"
          bash scripts/deploy-asg/deploy.sh

  deploy_production:
    name: Production ${{ needs.release.outputs.branch }}
    needs: [build, release, deploy_staging]
    if: ${{ vars.PRODUCTION_PROMOTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-broker-production
      queue: max
      cancel-in-progress: false
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote staged broker image
        env:
          DEPLOY_STAGE: production
          ASG_NAME: ${{ vars.EC2_ASG_NAME || 'alphamatics-prod-broker-asg' }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ID: ${{ vars.AWS_SECRET_ID }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          NATS_MAX_AGE_HOURS: ${{ vars.NATS_MAX_AGE_HOURS || '72' }}
          NATS_TELEMATICS_MAX_BYTES: ${{ vars.NATS_TELEMATICS_MAX_BYTES }}
          NATS_COMMANDS_MAX_BYTES: ${{ vars.NATS_COMMANDS_MAX_BYTES }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          export BROKER_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST"
          bash scripts/deploy-asg/deploy.sh
