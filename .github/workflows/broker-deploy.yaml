name: Deploy Broker

on:
  push:
    branches:
      - stage
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.ref_name }}
          docker build --target final -t $IMAGE .
          docker push $IMAGE

          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag $IMAGE ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
            docker push ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            NATS_DATA_DIR="${{ vars.NATS_DATA_DIR }}"
            if [ -z "$NATS_DATA_DIR" ]; then
              echo "NATS_DATA_DIR GitHub Environment variable is required"
              exit 1
            fi

            if ! mountpoint -q "$NATS_DATA_DIR"; then
              echo "$NATS_DATA_DIR is not a mounted filesystem; refusing to start NATS"
              exit 1
            fi

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}

            {
              echo "BROKER_IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.ref_name }}"
              echo "NATS_DATA_DIR=$NATS_DATA_DIR"
              echo "NATS_MAX_AGE_HOURS=${{ vars.NATS_MAX_AGE_HOURS || '72' }}"
              echo "NATS_TELEMATICS_MAX_BYTES=${{ vars.NATS_TELEMATICS_MAX_BYTES }}"
              echo "NATS_COMMANDS_MAX_BYTES=${{ vars.NATS_COMMANDS_MAX_BYTES }}"
            } | sudo tee /opt/broker/.image.env

            cd /opt/broker
            docker compose --env-file .image.env pull broker
            docker compose --env-file .image.env up -d broker
            docker image prune -f
