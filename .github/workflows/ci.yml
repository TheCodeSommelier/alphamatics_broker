name: CI

# Code checks only. The build itself happens once, inside the image, in the
# deploy workflow, which also calls this before it builds anything.
on:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # When called from a deploy, the deploy's own concurrency group decides.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --locked
